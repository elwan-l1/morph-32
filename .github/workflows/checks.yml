name: Checks
on: [push, pull_request]
jobs:
  static-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m 'not metal'
      - run: uv run python scripts/audit_evidence.py
      - run: uv run python paper/artifact.py
      - run: git diff --exit-code -- README.md paper/data/final-summary.json paper/data/artifact-verification.json paper/data/research/primary-20260911/summary.json paper/data/research/smaller-20260911/summary.json
      - run: uv build
