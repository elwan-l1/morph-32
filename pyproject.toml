[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "morph32-mlx"
version = "0.1.0"
description = "Orbit-recurrent weight quantization with direct Apple M5 Metal execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "psutil==7.2.2",
  "huggingface-hub>=1.0,<2",
]

[project.scripts]
morph32 = "morph32.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1", "pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/morph32"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["models", "checkpoints", "results", "evidence", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["metal: requires an Apple M5 GPU"]
